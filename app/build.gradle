plugins {
    id 'com.android.application'
}

android {
    namespace 'com.narezany.poezd'
    compileSdk 34

    defaultConfig {
        applicationId 'com.narezany.poezd'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1-alpha'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
